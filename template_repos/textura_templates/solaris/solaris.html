<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scene · Solaris</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }

  /* UI PANEL — remove this block to drop the controls */

    font: 11px/1.4 -apple-system, system-ui, sans-serif; padding: 8px 10px; border: 1px solid rgba(255,255,255,.12);
    border-radius: 6px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    max-width: 240px; max-height: 80vh; overflow: auto; z-index: 1000; user-select: none; }
  #ui-toggle { background: none; border: none; color: #fff; cursor: pointer; font-size: 14px; padding: 0; }

  #ui-panel.-open #ui-body { display: block; }
  #ui-body label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0; }
  #ui-body input[type=color] { width: 28px; height: 20px; border: 1px solid rgba(255,255,255,.2); border-radius: 3px; padding: 0; background: none; cursor: pointer; }
  #ui-body input[type=range] { width: 110px; }

  #ui-buttons button { flex: 1; cursor: pointer; background: rgba(255,255,255,.08); color: #fff;
    border: 1px solid rgba(255,255,255,.18); border-radius: 4px; padding: 5px 6px; font: 11px/1 sans-serif; }
  #ui-buttons button:hover { background: rgba(255,255,255,.16); }

    border: 1px solid rgba(255,255,255,.12); border-radius: 4px;

    white-space: pre-wrap; word-break: break-word; color: rgba(255,255,255,.88);
    max-height: 240px; overflow: auto; user-select: text; cursor: text; }
  /* END UI PANEL */
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }

<body>
<canvas id="scene"></canvas>

<!-- UI PANEL — remove this block to drop the controls -->
<div id="ui-panel">
  <button id="ui-toggle" type="button" aria-label="Toggle controls">⚙ controls</button>
  <div id="ui-body"></div>
  <pre id="ui-snapshot" title="Click to select, then copy. These are the current CONFIG values."></pre>
</div>
<!-- END UI PANEL -->

<script type="module">
import * as THREE from 'three'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'

/* ============================================================
   Solaris — the resting hero sphere extracted from the new-era
   landing page (src/views/home/particle-canvas.tsx + shaders/).
   A dense SphereGeometry rendered as Points, breathing on Simplex
   noise, over an fBm aurora backdrop, finished with UnrealBloom.
   Scroll is frozen at 0 (the hero's resting state); only the
   on-load intro dolly + the breathing noise + the corner aurora
   animate. CONFIG below drives the UI panel + localStorage.
============================================================ */
const CONFIG = {
  colorWarm: '#ff4c33',
  colorCool: '#3366ff',
  bloomStrength: 1.64,
  bloomRadius: 1.14,
  bloomThreshold: 0.04,
  noiseSpeed: 1.41,
  introSeconds: 2.4,
  cameraDistance: 10.8,
  cursorRadius: 2.0,        // reach of the cursor solar flare (world units)
  cursorFlare: 1.4,         // how far the prominence erupts outward
  cursorHeat: 1.0,          // how white-hot the flared particles glow
}

/* ---------- DEFAULTS + localStorage (load BEFORE building the scene) ---------- */
const DEFAULTS = JSON.parse(JSON.stringify(CONFIG))
const STORAGE_KEY = 'getlayers:solaris'
try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); if (s) for (const k in s) if (k in CONFIG) CONFIG[k] = s[k] } catch (e) {}
function saveConfig() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(CONFIG)) } catch (e) {} }

function hexToVec3(hex) {
  const n = parseInt(hex.slice(1), 16)
  return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255)
}

/* ---------- SHADERS (ported verbatim from new-era shaders/) ---------- */
const backgroundVertexShader = /* glsl */ `
    varying vec2 vUv;
    void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
    }
`

const backgroundFragmentShader = /* glsl */ `
    uniform float uTime;
    uniform float uScroll;
    uniform vec2 uResolution;
    uniform vec3 color1;
    uniform vec3 color2;
    varying vec2 vUv;

    // Morgan McGuire noise
    float hash(float n) { return fract(sin(n) * 1e4); }
    float hash(vec2 p) { return fract(1e4 * sin(17.0 * p.x + p.y * 0.1) * (0.1 + abs(sin(p.y * 13.0 + p.x)))); }
    float noise(vec2 x) {
        vec2 i = floor(x);
        vec2 f = fract(x);
        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
    }
    #define OCTAVES 4
    float fbm(vec2 x) {
        float v = 0.0;
        float a = 0.5;
        vec2 shift = vec2(100);
        mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.50));
        for (int i = 0; i < OCTAVES; ++i) {
            v += a * noise(x);
            x = rot * x * 2.0 + shift;
            a *= 0.5;
        }
        return v;
    }

    void main() {
        vec2 st = vUv;
        st.x *= uResolution.x / uResolution.y;

        // Faster animation + massive boost on scroll
        float t = uTime * 6.0 + uScroll * 150.0;

        // Scale coordinates for large, organic blurs
        vec2 st1 = st * 1.2;
        vec2 st2 = st * 1.6;

        // Shape 1: Deep Blue blurs (color2)
        float f1 = fbm(st1 + vec2(t * 0.15, t * 0.1));
        float mask1 = pow(fbm(st1 + f1 * 2.5 - vec2(t * 0.25, 0.0)), 2.0) * 3.5;

        // Shape 2: Blazing Orange blurs (color1)
        float f2 = fbm(st2 - vec2(t * 0.1, t * 0.2));
        float mask2 = pow(fbm(st2 + f2 * 2.0 + vec2(0.0, t * 0.2)), 2.5) * 4.0;

        // Additive blending for extreme saturation without muddy grays
        vec3 finalColor = color2 * mask1 + color1 * mask2;

        // Corner mask: hide the aurora in the center to keep focus on the 3D sphere
        // Using vUv ensures it stays perfectly centered regardless of devicePixelRatio!
        vec2 aspectUv = vUv - 0.5;
        aspectUv.x *= uResolution.x / uResolution.y;
        float centerDist = length(aspectUv);

        // Make the mask dynamic and organic!
        // Adding uScroll makes the "amoeba" actively spin and morph as you scroll
        float angle = atan(aspectUv.y, aspectUv.x) + uScroll * 15.0;
        // Combine a couple of slow sine waves to create an "amoeba" like breathing edge
        float maskOffset = sin(angle * 3.0 + t * 0.4) * 0.05
                         + sin(angle * 5.0 - t * 0.6) * 0.03;
        float dynamicDist = centerDist + maskOffset;

        // Push visibility entirely to the extreme corners
        float cornerFade = smoothstep(0.7, 1.15, dynamicDist);
        cornerFade = pow(cornerFade, 1.6);

        // Apply fade and reduce overall intensity to keep it subtle
        finalColor *= cornerFade * 0.9;

        // Deep dark background base
        vec3 baseBg = vec3(0.012, 0.012, 0.02);

        gl_FragColor = vec4(baseBg + finalColor, 1.0);
    }
`

const particleVertexShader = /* glsl */ `
    uniform float uTime;
    uniform float uScroll;
    uniform float uIntro; // 0 = on-load filled/appearing, 1 = settled
    uniform vec3 uColorTop;    // warm — top of the gradient
    uniform vec3 uColorBottom; // cool — bottom of the gradient
    uniform vec3 uCursor;        // cursor hit point on the sphere surface (world space)
    uniform float uCursorStrength; // 0 = idle, 1 = pointer touching the sphere
    uniform float uCursorRadius;
    uniform float uCursorFlare;
    uniform float uCursorHeat;
    varying float vEdgeFade;
    varying float vHeat;
    varying vec3 vColor;

    // 3D Simplex Noise
    vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
    float snoise(vec3 v){
      const vec2 C = vec2(1.0/6.0, 1.0/3.0); const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
      vec3 i = floor(v + dot(v, C.yyy)); vec3 x0 = v - i + dot(i, C.xxx);
      vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g;
      vec3 i1 = min(g.xyz, l.zxy); vec3 i2 = max(g.xyz, l.zxy);
      vec3 x1 = x0 - i1 + 1.0 * C.xxx; vec3 x2 = x0 - i2 + 2.0 * C.xxx; vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;
      i = mod(i, 289.0);
      vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
      float n_ = 1.0/7.0; vec3 ns = n_ * D.wyz - D.xzx;
      vec4 j = p - 49.0 * floor(p * ns.z *ns.z);
      vec4 x_ = floor(j * ns.z); vec4 y_ = floor(j - 7.0 * x_);
      vec4 x = x_ *ns.x + ns.yyyy; vec4 y = y_ *ns.x + ns.yyyy; vec4 h = 1.0 - abs(x) - abs(y);
      vec4 b0 = vec4(x.xy, y.xy); vec4 b1 = vec4(x.zw, y.zw);
      vec4 s0 = floor(b0)*2.0 + 1.0; vec4 s1 = floor(b1)*2.0 + 1.0; vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy; vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
      vec3 p0 = vec3(a0.xy,h.x); vec3 p1 = vec3(a0.zw,h.y); vec3 p2 = vec3(a1.xy,h.z); vec3 p3 = vec3(a1.zw,h.w);
      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
      p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
      vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0); m = m * m;
      return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }

    void main() {
        vec3 normalVec = normalize(position);

        // --- SPHERE POS (resting blob — breathing Simplex deformation) ---
        float noiseVal = snoise(position * 0.5 + uTime * 0.8);
        noiseVal += 0.5 * snoise(position * 1.5 - uTime * 1.2);
        vec3 spherePos = position + normalVec * (noiseVal * 0.5);

        // --- CURSOR SOLAR FLARE ---
        // The sphere sits at the origin with an identity model matrix, so its
        // local position == world position; uCursor is the pointer's hit point
        // on the surface. Particles within reach erupt outward along their
        // normal — a prominence that swells toward the cursor and flickers like
        // real plasma.
        float cursorDist = distance(spherePos, uCursor);
        float flareFall = 1.0 - smoothstep(0.0, uCursorRadius, cursorDist);
        flareFall = pow(flareFall, 1.5);
        float flicker = 0.65 + 0.35 * snoise(position * 3.0 + uTime * 5.0);
        float flare = flareFall * uCursorStrength * flicker;
        spherePos += normalVec * (flare * uCursorFlare);
        vHeat = clamp(flare * uCursorHeat, 0.0, 1.0);

        vec3 finalPos = spherePos;

        vec4 mvPosition = modelViewMatrix * vec4(finalPos, 1.0);

        // Fresnel / Edge fade
        vec3 viewDir = normalize(-mvPosition.xyz);
        vec3 worldNormal = normalize(normalMatrix * normalVec); // approximate normal
        float rim = 1.0 - abs(dot(viewDir, worldNormal));

        // Center dark, edges glowing — the signature hollow-ring look.
        float edgeFadeSphere = smoothstep(0.4, 0.9, rim);

        float opacityMultiplier = 0.8;
        float sizeMultiplier = 1.5;

        // Intro: at uIntro=0 the sphere is fully filled (whole disc visible);
        // as uIntro→1 the centre hollows back to the fresnel rim. A short fade
        // (smoothstep) brings the whole cloud up from nothing on load.
        float introSphere = mix(1.0, edgeFadeSphere, uIntro);
        vEdgeFade = introSphere * opacityMultiplier;
        vEdgeFade *= smoothstep(0.0, 0.2, uIntro);

        // Flared particles light up even in the hollow centre, and swell.
        vEdgeFade += vHeat * 0.7 * smoothstep(0.0, 0.2, uIntro);

        // --- COLORS — pure cool-to-warm gradient across the sphere ---
        float baseColorMix = smoothstep(-3.0, 3.0, position.y + position.x * 0.5);
        vColor = mix(uColorBottom, uColorTop, clamp(baseColorMix, 0.0, 1.0));

        gl_PointSize = sizeMultiplier * (10.0 / -mvPosition.z) * (1.0 + vHeat * 1.6);
        gl_PointSize = max(gl_PointSize, 1.5);

        gl_Position = projectionMatrix * mvPosition;
    }
`

const particleFragmentShader = /* glsl */ `
    varying float vEdgeFade;
    varying float vHeat;
    varying vec3 vColor;

    void main() {
        vec2 xy = gl_PointCoord.xy - vec2(0.5);
        float ll = length(xy);
        if(ll > 0.5) discard;

        // Soft round points
        float pointAlpha = smoothstep(0.5, 0.1, ll);

        // Flared particles burn toward a white-hot core.
        vec3 col = mix(vColor, vec3(1.0, 0.96, 0.84), vHeat);

        gl_FragColor = vec4(col, vEdgeFade * pointAlpha * 0.9);
    }
`

/* ---------- RENDERER / SCENE / CAMERA ---------- */
const canvas = document.getElementById('scene')
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true })
renderer.setSize(window.innerWidth, window.innerHeight)
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
renderer.autoClear = false

const scene = new THREE.Scene()
scene.background = new THREE.Color(0x000000)

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000)
camera.position.z = CONFIG.cameraDistance

/* ---------- AURORA BACKGROUND (orthographic fullscreen quad) ---------- */
const bgScene = new THREE.Scene()
const bgCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, -1, 1)
const bgGeometry = new THREE.PlaneGeometry(2, 2)
const bgMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uScroll: { value: 0.0 },
    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    color1: { value: new THREE.Color(CONFIG.colorWarm) },
    color2: { value: new THREE.Color(CONFIG.colorCool) }
  },
  vertexShader: backgroundVertexShader,
  fragmentShader: backgroundFragmentShader,
  depthWrite: false
})
bgScene.add(new THREE.Mesh(bgGeometry, bgMaterial))

/* ---------- PARTICLE SPHERE (dense SphereGeometry rendered as Points) ---------- */
const geometry = new THREE.SphereGeometry(4.2, 200, 600)
const material = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uScroll: { value: 0.0 },
    uIntro: { value: 0.0 },
    uColorTop:    { value: hexToVec3(CONFIG.colorWarm) },
    uColorBottom: { value: hexToVec3(CONFIG.colorCool) },
    uCursor:         { value: new THREE.Vector3(0, 0, 4.2) },
    uCursorStrength: { value: 0 },
    uCursorRadius:   { value: CONFIG.cursorRadius },
    uCursorFlare:    { value: CONFIG.cursorFlare },
    uCursorHeat:     { value: CONFIG.cursorHeat }
  },
  vertexShader: particleVertexShader,
  fragmentShader: particleFragmentShader,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
})
const particles = new THREE.Points(geometry, material)
particles.frustumCulled = false
scene.add(particles)

/* ---------- POST-PROCESSING (BLOOM) ---------- */
const composer = new EffectComposer(renderer)
const renderBg = new RenderPass(bgScene, bgCamera)
composer.addPass(renderBg)
const renderFg = new RenderPass(scene, camera)
renderFg.clear = false
renderFg.clearDepth = true
composer.addPass(renderFg)
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  CONFIG.bloomStrength,
  CONFIG.bloomRadius,
  CONFIG.bloomThreshold
)
composer.addPass(bloomPass)

/* ---------- CONFIG → uniforms / passes ---------- */
function applyConfig() {
  bgMaterial.uniforms.color1.value.set(CONFIG.colorWarm)
  bgMaterial.uniforms.color2.value.set(CONFIG.colorCool)
  material.uniforms.uColorTop.value.copy(hexToVec3(CONFIG.colorWarm))
  material.uniforms.uColorBottom.value.copy(hexToVec3(CONFIG.colorCool))
  bloomPass.strength = CONFIG.bloomStrength
  bloomPass.radius = CONFIG.bloomRadius
  bloomPass.threshold = CONFIG.bloomThreshold
  material.uniforms.uCursorRadius.value = CONFIG.cursorRadius
  material.uniforms.uCursorFlare.value = CONFIG.cursorFlare
  material.uniforms.uCursorHeat.value = CONFIG.cursorHeat
}

/* ---------- RESIZE ---------- */
function resize() {
  const w = window.innerWidth, h = window.innerHeight
  camera.aspect = w / h
  camera.updateProjectionMatrix()
  renderer.setSize(w, h)
  composer.setSize(w, h)
  bgMaterial.uniforms.uResolution.value.set(w, h)
}
window.addEventListener('resize', resize)

/* ---------- CURSOR PICKING (drives the solar flare) ---------- */
// An invisible mesh matching the point sphere — never added to the scene, used
// only to raycast the pointer onto the surface. The flare point trails the hit
// with a lerp so the prominence chases the cursor with a little plasma lag.
const pickSphere = new THREE.Mesh(new THREE.SphereGeometry(4.2, 48, 48))
const raycaster = new THREE.Raycaster()
const pointer = new THREE.Vector2()
let pointerInside = false
const cursorTarget = new THREE.Vector3(0, 0, 4.2)

function onPointerMove(e) {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1
  pointerInside = true
}
window.addEventListener('pointermove', onPointerMove)
window.addEventListener('pointerdown', onPointerMove)
window.addEventListener('pointerleave', () => { pointerInside = false })

/* ---------- RENDER LOOP ---------- */
let time = 0
let introStart = 0

function render(now) {
  requestAnimationFrame(render)
  time += 0.005 * CONFIG.noiseSpeed

  // Intro progress (eased), driven by wall-clock since the first frame.
  if (introStart === 0) introStart = now
  const introMs = CONFIG.introSeconds * 1000
  const introRaw = Math.min((now - introStart) / introMs, 1)
  const introEased = 1 - Math.pow(1 - introRaw, 3) // easeOutCubic
  material.uniforms.uIntro.value = introEased

  material.uniforms.uTime.value = time
  bgMaterial.uniforms.uTime.value = time

  // Resting hero composition — scroll frozen at 0. The only camera motion is
  // the on-load dolly: start ~3 units closer (sphere fills the view) and ease
  // back to the resting z, focal point held straight ahead.
  const introZoom = (1 - introEased) * -3.0
  camera.position.set(0, 0, CONFIG.cameraDistance + introZoom)
  camera.lookAt(0, 0, CONFIG.cameraDistance - 100.0)

  // Raycast the pointer onto the sphere; ramp the flare up while it's over the
  // surface, ease it down otherwise, and let the flare point trail the hit.
  let overSphere = false
  if (pointerInside) {
    raycaster.setFromCamera(pointer, camera)
    const hit = raycaster.intersectObject(pickSphere, false)[0]
    if (hit) { cursorTarget.copy(hit.point); overSphere = true }
  }
  const sU = material.uniforms.uCursorStrength
  sU.value += ((overSphere ? 1 : 0) - sU.value) * 0.09
  material.uniforms.uCursor.value.lerp(cursorTarget, 0.18)

  composer.render()
}
requestAnimationFrame(render)

/* ===== UI (remove this block to drop the panel) ===== */
function setupColorUI(config, apply) {
  const panel = document.getElementById('ui-panel')
  const toggle = document.getElementById('ui-toggle')
  const body = document.getElementById('ui-body')
  if (!panel) return
  toggle.addEventListener('click', () => panel.classList.toggle('-open'))
  // Wrap apply so every change also saves + refreshes the snapshot.
  const _apply = apply
  apply = () => { _apply(); saveConfig(); renderSnapshot(config) }
  // Override slider ranges for non-color numbers here (default range is 0..2×value).
  const numericRanges = {
    bloomStrength:  { min: 0, max: 3,  step: 0.01 },
    bloomRadius:    { min: 0, max: 2,  step: 0.01 },
    bloomThreshold: { min: 0, max: 1,  step: 0.01 },
    noiseSpeed:     { min: 0, max: 3,  step: 0.01 },
    introSeconds:   { min: 0, max: 6,  step: 0.1  },
    cameraDistance: { min: 2, max: 20, step: 0.1  },
    cursorRadius:   { min: 0, max: 5,  step: 0.05 },
    cursorFlare:    { min: 0, max: 4,  step: 0.05 },
    cursorHeat:     { min: 0, max: 2,  step: 0.05 }
  }
  for (const key of Object.keys(config)) {
    const v = config[key]
    const row = document.createElement('label')
    row.appendChild(Object.assign(document.createElement('span'), { textContent: key }))
    if (typeof v === 'string' && v[0] === '#') {
      const inp = document.createElement('input')
      inp.type = 'color'; inp.value = v
      inp.addEventListener('input', e => { config[key] = e.target.value; apply() })
      row.appendChild(inp)
    } else if (typeof v === 'number') {
      const r = numericRanges[key] || { min: 0, max: Math.max(1, v * 2), step: 0.01 }
      const inp = document.createElement('input')
      inp.type = 'range'; inp.min = String(r.min); inp.max = String(r.max); inp.step = String(r.step); inp.value = String(v)
      inp.addEventListener('input', e => {
        let val = parseFloat(e.target.value)
        if (Number.isInteger(r.step)) val = Math.round(val / r.step) * r.step   // integer-step sliders stay integral
        config[key] = val
        apply()
      })
      row.appendChild(inp)
    }
    body.appendChild(row)
  }
  // Reload / Reset buttons
  const btns = document.createElement('div'); btns.id = 'ui-buttons'
  const reloadBtn = document.createElement('button'); reloadBtn.type = 'button'; reloadBtn.textContent = '⟳ reload'
  const resetBtn  = document.createElement('button'); resetBtn.type = 'button'; resetBtn.textContent = '↺ reset'
  reloadBtn.title = 'Reload the page — re-initialise the scene with the saved settings'
  resetBtn.title = 'Clear saved settings and reload with defaults'
  reloadBtn.addEventListener('click', () => location.reload())
  resetBtn.addEventListener('click', () => { try { localStorage.removeItem(STORAGE_KEY) } catch (e) {} ; location.reload() })
  btns.appendChild(reloadBtn); btns.appendChild(resetBtn)
  body.appendChild(btns)
  panel.classList.add('-open')
  renderSnapshot(config)
}
function renderSnapshot(config) {
  const snap = document.getElementById('ui-snapshot')
  if (!snap) return
  const lines = ['const CONFIG = {']
  for (const key of Object.keys(config)) {
    const v = config[key]
    let formatted
    if (typeof v === 'string') formatted = "'" + v + "'"
    else if (Number.isInteger(v)) formatted = String(v)
    else formatted = String(parseFloat(v.toFixed(4)))
    lines.push('  ' + key + ': ' + formatted + ',')
  }
  lines.push('}')
  snap.textContent = lines.join('\n')
}

resize()
applyConfig()
setupColorUI(CONFIG, applyConfig)
/* ===== END UI ===== */
</script>
</body>
</html>
