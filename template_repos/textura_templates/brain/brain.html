<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js'

/* ============================================================
   CONFIG — ported from brain-story BRAIN_CONFIG (same colours)
============================================================ */
const CONFIG = {
  modelUrl: 'assets/brain/rotten-brain.glb',
  brainCool: '#0a3f70',
  brainWarm: '#70bcff',
  edgeColor: '#1f6ae0',
  centerColor: '#000000',
  centerRadius: 0.37,
  centerFalloff: 4,
  synapseColor: '#eaf3ff',
  ambientColor: '#2b5a9c',
  particleSize: 0.067,
  ambientSize: 0.067,
  ambientCount: 4500,
  ambientSpeed: 0.03,
  ambientRange: 15.5,
  surfaceCount: 140000,
  synapseRate: 0.1,
  flowSpeed: 2.3,
  flowAmount: 0.025,
  glowStrength: 2,
  depthDarkness: 1,
  deepColor: '#010b1e',
  cursorColor: '#000000',
  cornerBlue: '#0f5fcf',
  cornerOrange: '#040f2e',
  baseRotationY: -1.5708,
  scrollSpin: 6.2832,
  brainZ: 1.25,
  cursorTilt: 0.22,              // how far the brain swivels/tilts toward the cursor (radians, both axes)
}

/* DEFAULTS + localStorage (load before building so saved values apply) */
const DEFAULTS = JSON.parse(JSON.stringify(CONFIG))
const STORAGE_KEY = 'getlayers:brain'
try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); if (s) for (const k in s) if (k in CONFIG) CONFIG[k] = s[k] } catch (e) {}
function saveConfig() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(CONFIG)) } catch (e) {} }

const hexToVec3 = (hex) => {
  const n = parseInt(hex.slice(1), 16)
  return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255)
}

/* ============================================================
   SHADERS — ported verbatim from brain-story lib/shaders.ts
============================================================ */
const AMBIENT_VERTEX = `
  attribute vec3 aDir;
  attribute float aSeed;
  uniform float iTime; uniform float iResolutionY; uniform float uSize; uniform float uSpeed; uniform float uRange;
  varying float vSeed; varying float vPhase;
  void main() {
    vSeed = aSeed;
    float speed = 0.35 + aSeed * 0.9;
    float phase = fract(iTime * uSpeed * speed + aSeed);
    vPhase = phase;
    vec3 dir = normalize(aDir + vec3(1e-5));
    vec3 p = position + dir * phase * uRange;
    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    gl_Position = projectionMatrix * mv;
    float lifeSize = mix(1.0, 0.6, phase);
    gl_PointSize = uSize * lifeSize * (iResolutionY / 720.0) * (200.0 / -mv.z);
  }
`
const AMBIENT_FRAGMENT = `
  uniform vec3 uColor; uniform float iAlpha;
  varying float vSeed; varying float vPhase;
  void main() {
    vec2 p = gl_PointCoord - 0.5;
    float r = length(p);
    if (r > 0.5) discard;
    float k = smoothstep(0.5, 0.0, r);
    float life = smoothstep(0.0, 0.1, vPhase) * smoothstep(1.0, 0.7, vPhase);
    float twinkle = 0.5 + 0.5 * sin(vSeed * 40.0 + vPhase * 30.0);
    gl_FragColor = vec4(uColor * k * life * (0.4 + 0.6 * twinkle), k * life * iAlpha * 0.6);
  }
`
const BRAIN_VERTEX = `
  attribute float aSeed; attribute float aOcclusion; attribute vec3 aNormal;
  uniform float iTime; uniform float iResolutionY; uniform float uSize; uniform float uSynapseRate;
  uniform float uCenterRadius; uniform float uFlowSpeed; uniform float uFlowAmount;
  uniform vec3 uHighlightPos; uniform float uHighlightRadius; uniform float uHighlightStrength;
  uniform float uExplode; uniform float uExplodeDist;
  uniform vec2 uMouse; uniform float uCursor; uniform float uAspect; uniform float uCursorRadius;
  varying float vSeed; varying float vSynapse; varying float vHemi; varying float vDepth;
  varying float vFrontness; varying float vCenterness; varying float vOcclusion; varying float vHighlight;
  varying float vFar; varying float vCursor; varying vec3 vWorldPos;
  void main() {
    vSeed = aSeed; vOcclusion = aOcclusion;
    vec3 p = position; vWorldPos = p; vHemi = step(0.0, p.x);
    vHighlight = (1.0 - smoothstep(0.0, uHighlightRadius, distance(position, uHighlightPos))) * uHighlightStrength;
    vec3 focalDir = normalize(uHighlightPos + vec3(1e-5));
    float align = dot(normalize(position + vec3(1e-5)), focalDir);
    vFar = smoothstep(0.55, -0.35, align);
    vec3 rad = normalize(p + vec3(1e-5));
    float breathe = sin(iTime * 1.6 + aSeed * 6.0) * 0.012;
    p += rad * breathe;
    vec3 nrm = normalize(aNormal + vec3(1e-5));
    vec3 ref = abs(nrm.y) < 0.95 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
    vec3 tA = normalize(cross(nrm, ref));
    vec3 tB = cross(nrm, tA);
    float ph = iTime * uFlowSpeed + aSeed * 6.2831;
    vec3 loopDir = tA * cos(ph) + tB * sin(ph);
    p += loopDir * uFlowAmount;
    vec3 exDir = normalize(rad + vec3(sin(aSeed * 41.0), cos(aSeed * 57.0), sin(aSeed * 73.0)) * 0.45);
    p += exDir * uExplode * uExplodeDist;
    float period = mix(3.0, 9.0, aSeed);
    float firePhase = aSeed * period;
    float ft = mod(iTime + firePhase, period);
    float fire = pow(clamp(1.0 - ft / 0.4, 0.0, 1.0), 2.5);
    if (aSeed > uSynapseRate) fire = 0.0;
    vSynapse = fire;
    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    vec4 centerMv = modelViewMatrix * vec4(0.0, 0.0, 0.0, 1.0);
    float rel = centerMv.z - mv.z;
    vFrontness = clamp(rel * 0.6 + 0.5, 0.0, 1.0);
    gl_Position = projectionMatrix * mv;
    vec4 centerClip = projectionMatrix * centerMv;
    vec2 centerNDC = centerClip.xy / max(0.0001, centerClip.w);
    vec2 pNDC = gl_Position.xy / max(0.0001, gl_Position.w);
    float screenDist = length(pNDC - centerNDC);
    vCenterness = 1.0 - clamp(screenDist / max(0.05, uCenterRadius), 0.0, 1.0);
    vec2 dMouse = pNDC - uMouse; dMouse.x *= uAspect;
    vCursor = (1.0 - smoothstep(0.0, uCursorRadius, length(dMouse))) * uCursor;
    float baseSize = uSize * (iResolutionY / 720.0) * (200.0 / -mv.z);
    gl_PointSize = baseSize * (1.0 + fire * 2.5 + vHighlight * 1.8 + vCursor * 1.3);
    vDepth = -mv.z;
  }
`
const BRAIN_FRAGMENT = `
  uniform vec3 uCool; uniform vec3 uWarm; uniform vec3 uEdgeColor; uniform vec3 uCenterColor;
  uniform float uCenterFalloff; uniform vec3 uSynapse; uniform float iAlpha; uniform float uGlow;
  uniform float uDepthDarkness; uniform vec3 uDeepColor; uniform float uOcclusionStrength;
  uniform vec3 uHighlightColor; uniform float uHighlightStrength; uniform float uFocusFadeStrength;
  uniform float uIsolateStrength; uniform float uExplode; uniform vec3 uCursorColor;
  varying float vSeed; varying float vSynapse; varying float vHemi; varying float vDepth;
  varying float vFrontness; varying float vCenterness; varying float vOcclusion; varying float vHighlight;
  varying float vFar; varying float vCursor; varying vec3 vWorldPos;
  void main() {
    vec2 p = gl_PointCoord - 0.5;
    float r = length(p);
    if (r > 0.5) discard;
    float core = pow(smoothstep(0.5, 0.0, r), 2.2);
    float t = pow(vCenterness, max(0.05, uCenterFalloff));
    vec3 base = mix(uEdgeColor, uCenterColor, t);
    vec3 yTint = mix(uCool, uWarm, smoothstep(-0.6, 1.0, vWorldPos.y) * 0.6 + vSeed * 0.25);
    yTint = mix(yTint, yTint * vec3(0.95, 1.0, 1.05), vHemi * 0.4);
    base *= mix(vec3(1.0), yTint, 0.35);
    base = mix(base, uDeepColor, clamp(vOcclusion * uOcclusionStrength, 0.0, 1.0));
    vec3 col = base + uSynapse * vSynapse * 2.0;
    col = mix(col, uHighlightColor, vHighlight * 0.5);
    col += uHighlightColor * vHighlight * 0.7;
    float nonFocus = (1.0 - vHighlight) * uHighlightStrength;
    col = mix(col, uDeepColor, nonFocus * uIsolateStrength);
    float depthMul = mix(1.0 - uDepthDarkness, 1.0, vFrontness);
    col *= depthMul;
    float alphaOut = core * iAlpha * mix(1.0 - uDepthDarkness * 0.7, 1.0, vFrontness);
    alphaOut *= 1.0 + vHighlight * 0.8;
    float focusDim = 1.0 - uHighlightStrength * uFocusFadeStrength * vFar;
    col *= focusDim; alphaOut *= focusDim;
    col += uCursorColor * vCursor * 0.8;
    alphaOut += vCursor * core * 0.32;
    alphaOut *= 1.0 - smoothstep(0.0, 1.0, uExplode) * 0.8;
    gl_FragColor = vec4(col * uGlow, alphaOut);
  }
`
const FINAL_VERTEX = `
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
`
const FINAL_FRAGMENT = `
  uniform float iTime; uniform sampler2D tScene; uniform vec3 iCornerBlue; uniform vec3 iCornerOrange;
  varying vec2 vUv;
  vec3 warp3d(vec3 pos, float t) {
    float curv = .8, a = 1.9, b = 0.7; pos *= 2.;
    pos.x += curv * sin(t + a * pos.y) + t * b; pos.y += curv * cos(t + a * pos.x);
    pos.y += curv * sin(t + a * pos.z) + t * b; pos.z += curv * cos(t + a * pos.y);
    pos.z += curv * sin(t + a * pos.x) + t * b; pos.x += curv * cos(t + a * pos.z);
    return 0.5 + 0.5 * cos(pos.xyz + vec3(1, 2, 4));
  }
  void main() {
    vec2 uv = 2. * vUv - 1.;
    vec3 w = pow(warp3d(vec3(uv.x, sin(uv.y), uv.y), iTime * 1.5), vec3(1.5));
    vec3 col = 1.5 * iCornerBlue * w.x; col *= w.y; col += iCornerOrange * w.z;
    col *= smoothstep(0.6, 1., abs(uv.y));
    col *= smoothstep(-.5, 1., -uv.y * uv.x); col *= smoothstep(-.5, 1., -uv.y * uv.x);
    gl_FragColor = vec4(col + texture2D(tScene, vUv).xyz, 1.);
  }
`

/* ============================================================
   GEOMETRY HELPERS — ported from brain-story lib/sampling.ts
============================================================ */
function gatherTriangles(root) {
  const tris = []
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3()
  root.updateMatrixWorld(true)
  root.traverse((node) => {
    if (!node.isMesh || !node.geometry) return
    const pos = node.geometry.attributes.position, idx = node.geometry.index, mat = node.matrixWorld
    if (idx) {
      for (let i = 0; i < idx.count; i += 3) {
        a.fromBufferAttribute(pos, idx.array[i]).applyMatrix4(mat)
        b.fromBufferAttribute(pos, idx.array[i + 1]).applyMatrix4(mat)
        c.fromBufferAttribute(pos, idx.array[i + 2]).applyMatrix4(mat)
        tris.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z)
      }
    } else {
      for (let i = 0; i < pos.count; i += 3) {
        a.fromBufferAttribute(pos, i).applyMatrix4(mat)
        b.fromBufferAttribute(pos, i + 1).applyMatrix4(mat)
        c.fromBufferAttribute(pos, i + 2).applyMatrix4(mat)
        tris.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z)
      }
    }
  })
  return Float32Array.from(tris)
}
function sampleSurface(tri, count) {
  const nTris = tri.length / 9, areas = new Float32Array(nTris)
  let total = 0
  const u = new THREE.Vector3(), v = new THREE.Vector3(), w = new THREE.Vector3()
  for (let i = 0; i < nTris; i++) {
    const o = i * 9
    u.set(tri[o], tri[o + 1], tri[o + 2]); v.set(tri[o + 3], tri[o + 4], tri[o + 5]); w.set(tri[o + 6], tri[o + 7], tri[o + 8])
    v.sub(u); w.sub(u)
    const area = v.cross(w).length() * 0.5; areas[i] = area; total += area
  }
  const cdf = new Float32Array(nTris); let acc = 0
  for (let i = 0; i < nTris; i++) { acc += areas[i] / total; cdf[i] = acc }
  const out = new Float32Array(count * 3), normals = new Float32Array(count * 3)
  for (let s = 0; s < count; s++) {
    const r = Math.random(); let lo = 0, hi = nTris - 1
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cdf[mid] < r) lo = mid + 1; else hi = mid }
    const o = lo * 9; let su = Math.random(), sv = Math.random()
    if (su + sv > 1) { su = 1 - su; sv = 1 - sv }
    const sw = 1 - su - sv
    out[s * 3] = sw * tri[o] + su * tri[o + 3] + sv * tri[o + 6]
    out[s * 3 + 1] = sw * tri[o + 1] + su * tri[o + 4] + sv * tri[o + 7]
    out[s * 3 + 2] = sw * tri[o + 2] + su * tri[o + 5] + sv * tri[o + 8]
    const e1x = tri[o + 3] - tri[o], e1y = tri[o + 4] - tri[o + 1], e1z = tri[o + 5] - tri[o + 2]
    const e2x = tri[o + 6] - tri[o], e2y = tri[o + 7] - tri[o + 1], e2z = tri[o + 8] - tri[o + 2]
    let nx = e1y * e2z - e1z * e2y, ny = e1z * e2x - e1x * e2z, nz = e1x * e2y - e1y * e2x
    const nl = Math.hypot(nx, ny, nz) || 1
    normals[s * 3] = nx / nl; normals[s * 3 + 1] = ny / nl; normals[s * 3 + 2] = nz / nl
  }
  return { positions: out, normals }
}
function centerAndScale(positions, targetRadius) {
  let cx = 0, cy = 0, cz = 0; const n = positions.length / 3
  for (let i = 0; i < n; i++) { cx += positions[i * 3]; cy += positions[i * 3 + 1]; cz += positions[i * 3 + 2] }
  cx /= n; cy /= n; cz /= n
  let maxR = 0
  for (let i = 0; i < n; i++) {
    const dx = positions[i * 3] - cx, dy = positions[i * 3 + 1] - cy, dz = positions[i * 3 + 2] - cz
    const r = Math.sqrt(dx * dx + dy * dy + dz * dz); if (r > maxR) maxR = r
  }
  const k = targetRadius / Math.max(1e-6, maxR)
  for (let i = 0; i < n; i++) {
    positions[i * 3] = (positions[i * 3] - cx) * k
    positions[i * 3 + 1] = (positions[i * 3 + 1] - cy) * k
    positions[i * 3 + 2] = (positions[i * 3 + 2] - cz) * k
  }
}
function makeAmbientBuffers(count) {
  const positions = new Float32Array(count * 3), dirs = new Float32Array(count * 3), seeds = new Float32Array(count)
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2, phi = Math.acos(2 * Math.random() - 1), r = 1.5 + Math.random() * 0.5
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta)
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta)
    positions[i * 3 + 2] = r * Math.cos(phi)
    const dt = Math.random() * Math.PI * 2, dp = Math.acos(2 * Math.random() - 1)
    dirs[i * 3] = Math.sin(dp) * Math.cos(dt); dirs[i * 3 + 1] = Math.sin(dp) * Math.sin(dt); dirs[i * 3 + 2] = Math.cos(dp)
    seeds[i] = Math.random()
  }
  return { positions, dirs, seeds }
}
const makeSeeds = (count) => { const s = new Float32Array(count); for (let i = 0; i < count; i++) s[i] = Math.random(); return s }

/* ============================================================
   RENDERER / SCENE / CAMERA
============================================================ */
const canvas = document.getElementById('scene')
const renderer = new THREE.WebGL1Renderer({ canvas, antialias: true })
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
const scene = new THREE.Scene()
scene.background = new THREE.Color(0x01040e)
scene.fog = new THREE.Fog(0x01040e, 0, 18)
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 80)
camera.position.set(0, 0.15, 5.2)
camera.lookAt(0, 0, 0)

const group = new THREE.Group()
group.rotation.y = CONFIG.baseRotationY
const HIDDEN_Z = -9
group.position.z = HIDDEN_Z
scene.add(group)

const brainUniforms = {
  iTime: { value: 0 }, iAlpha: { value: 0 }, iResolutionY: { value: 720 },
  uCool: { value: hexToVec3(CONFIG.brainCool) }, uWarm: { value: hexToVec3(CONFIG.brainWarm) },
  uEdgeColor: { value: hexToVec3(CONFIG.edgeColor) }, uCenterColor: { value: hexToVec3(CONFIG.centerColor) },
  uCenterRadius: { value: CONFIG.centerRadius }, uCenterFalloff: { value: CONFIG.centerFalloff },
  uSynapse: { value: hexToVec3(CONFIG.synapseColor) }, uSize: { value: CONFIG.particleSize },
  uSynapseRate: { value: CONFIG.synapseRate }, uFlowSpeed: { value: CONFIG.flowSpeed }, uFlowAmount: { value: CONFIG.flowAmount },
  uGlow: { value: CONFIG.glowStrength }, uDepthDarkness: { value: CONFIG.depthDarkness },
  uDeepColor: { value: hexToVec3(CONFIG.deepColor) }, uOcclusionStrength: { value: 0 },
  uHighlightColor: { value: hexToVec3('#2563eb') }, uHighlightPos: { value: new THREE.Vector3() },
  uHighlightRadius: { value: 0.6 }, uHighlightStrength: { value: 0 }, uFocusFadeStrength: { value: 0.55 },
  uIsolateStrength: { value: 0.88 }, uExplode: { value: 0 }, uExplodeDist: { value: 5 },
  uMouse: { value: new THREE.Vector2(-10, -10) }, uCursor: { value: 0 }, uAspect: { value: 1 },
  uCursorRadius: { value: 0.1 }, uCursorColor: { value: hexToVec3(CONFIG.cursorColor) },
}
const ambientUniforms = {
  iTime: { value: 0 }, iAlpha: { value: 0 }, iResolutionY: { value: 720 },
  uColor: { value: hexToVec3(CONFIG.ambientColor) }, uSize: { value: CONFIG.ambientSize },
  uSpeed: { value: CONFIG.ambientSpeed }, uRange: { value: CONFIG.ambientRange },
}

const brainMat = new THREE.ShaderMaterial({
  uniforms: brainUniforms, vertexShader: BRAIN_VERTEX, fragmentShader: BRAIN_FRAGMENT,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
})
const ambientMat = new THREE.ShaderMaterial({
  uniforms: ambientUniforms, vertexShader: AMBIENT_VERTEX, fragmentShader: AMBIENT_FRAGMENT,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
})

// ambient cloud (built immediately — doesn't need the model)
{
  const { positions, dirs, seeds } = makeAmbientBuffers(CONFIG.ambientCount)
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.BufferAttribute(positions, 3))
  g.setAttribute('aDir', new THREE.BufferAttribute(dirs, 3))
  g.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1))
  const pts = new THREE.Points(g, ambientMat); pts.frustumCulled = false
  group.add(pts)
}

/* ---------- composite pipeline (scene + real bloom → warped corner gradient) ---------- */
const res = new THREE.Vector2(window.innerWidth, window.innerHeight)
const sceneComposer = new EffectComposer(renderer); sceneComposer.renderToScreen = false
sceneComposer.addPass(new RenderPass(scene, camera))
sceneComposer.addPass(new UnrealBloomPass(res, 0.7, 0.4, 0))
const finalPass = new ShaderPass({
  uniforms: {
    iTime: { value: 0 }, tScene: { value: null },
    iCornerBlue: { value: hexToVec3(CONFIG.cornerBlue) }, iCornerOrange: { value: hexToVec3(CONFIG.cornerOrange) },
  },
  vertexShader: FINAL_VERTEX, fragmentShader: FINAL_FRAGMENT,
})
const finalComposer = new EffectComposer(renderer)
finalComposer.addPass(finalPass)

/* ---------- interaction: cursor halo + scroll spin ---------- */
const pointerNDC = new THREE.Vector2(-10, -10)
let cursorTarget = 0
window.addEventListener('pointermove', (e) => {
  pointerNDC.set((e.clientX / window.innerWidth) * 2 - 1, -((e.clientY / window.innerHeight) * 2 - 1))
  cursorTarget = 1
})
window.addEventListener('pointerout', () => { cursorTarget = 0 })

let scrollTarget = 0, scrollCurrent = 0
let parRX = 0, parRY = 0   // damped cursor-parallax rotation offsets (tilt + horizontal swivel)
function onScroll() {
  const max = window.innerHeight || 1                 // one screen of scroll = full effect
  scrollTarget = Math.min(1, (window.scrollY || window.pageYOffset || 0) / max)
}
window.addEventListener('scroll', onScroll, { passive: true }); onScroll()

function resize() {
  const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(window.devicePixelRatio, 2)
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false)
  camera.aspect = w / h; camera.updateProjectionMatrix()
  for (const c of [sceneComposer, finalComposer]) { c.setPixelRatio(dpr); c.setSize(w, h) }
  brainUniforms.iResolutionY.value = h * dpr
  ambientUniforms.iResolutionY.value = h * dpr
}
window.addEventListener('resize', resize); resize()

/* ---------- load the brain model, then start the loop ---------- */
const APPEAR = 1.0
const clock = new THREE.Clock()
let appearStart = null
let ready = false

// Tell the recorder this scene loads an async GLB — wait for window.__sceneReady before capturing.
window.__sceneNeedsReady = true

new GLTFLoader().load(CONFIG.modelUrl, (gltf) => {
  const tris = gatherTriangles(gltf.scene)
  const { positions, normals } = sampleSurface(tris, CONFIG.surfaceCount)
  centerAndScale(positions, 1.45)
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.BufferAttribute(positions, 3))
  g.setAttribute('aNormal', new THREE.BufferAttribute(normals, 3))
  g.setAttribute('aSeed', new THREE.BufferAttribute(makeSeeds(positions.length / 3), 1))
  g.setAttribute('aOcclusion', new THREE.BufferAttribute(new Float32Array(positions.length / 3), 1))
  const pts = new THREE.Points(g, brainMat); pts.frustumCulled = false
  group.add(pts)
  ready = true
  appearStart = clock.getElapsedTime()
})

function render() {
  requestAnimationFrame(render)
  const t = clock.getElapsedTime()

  // entrance reveal (easeOutQuart), once the model is ready
  const p = appearStart === null ? 0 : Math.min(1, (t - appearStart) / APPEAR)
  const eased = 1 - Math.pow(1 - p, 4)
  group.position.z = HIDDEN_Z + (CONFIG.brainZ - HIDDEN_Z) * eased
  const entranceExplode = 1 - eased
  // signal the recorder only once the brain has fully assembled (so the capture/poster
  // shows the settled brain, not the fly-in)
  if (p >= 1 && !window.__sceneReady) window.__sceneReady = true

  // scroll → horizontal spin (damped); cursor parallax tilt on top
  scrollCurrent += (scrollTarget - scrollCurrent) * 0.08
  // cursor parallax: swivel horizontally (Y) toward the pointer's x, tilt (X) toward its y —
  // so moving the cursor rotates the brain a little in BOTH directions, layered on the scroll spin.
  const k = brainUniforms.uCursor.value
  const px = Math.max(-1, Math.min(1, pointerNDC.x))
  const py = Math.max(-1, Math.min(1, pointerNDC.y))
  const tRY = px * CONFIG.cursorTilt * k
  const tRX = -py * CONFIG.cursorTilt * 0.65 * k
  parRY += (tRY - parRY) * 0.05
  parRX += (tRX - parRX) * 0.05
  group.rotation.y = CONFIG.baseRotationY + scrollCurrent * CONFIG.scrollSpin + parRY
  group.rotation.x = parRX

  // brain uniforms
  brainUniforms.iTime.value = t
  brainUniforms.iAlpha.value = eased
  brainUniforms.uExplode.value = entranceExplode
  brainUniforms.uMouse.value.lerp(pointerNDC, 0.18)
  brainUniforms.uAspect.value = window.innerWidth / Math.max(1, window.innerHeight)
  brainUniforms.uCursor.value += (cursorTarget - brainUniforms.uCursor.value) * 0.1
  const camDist = camera.position.length()
  brainUniforms.uCursorRadius.value = Math.min(0.13, Math.max(0.04, (0.1 * 4.6) / camDist))
  ambientUniforms.iTime.value = t
  ambientUniforms.iAlpha.value = eased

  // composite
  finalPass.uniforms.iTime.value = t
  sceneComposer.render()
  finalPass.uniforms.tScene.value = sceneComposer.readBuffer.texture
  finalComposer.render()
}
render()

/* ============================================================
   applyConfig — push CONFIG values into the live uniforms.
   (baseRotationY / scrollSpin / brainZ are read live in the loop;
    surfaceCount / ambientCount only take effect on ⟳ reload.)
============================================================ */
function applyConfig() {
  const b = brainUniforms, a = ambientUniforms
  b.uCool.value.copy(hexToVec3(CONFIG.brainCool))
  b.uWarm.value.copy(hexToVec3(CONFIG.brainWarm))
  b.uEdgeColor.value.copy(hexToVec3(CONFIG.edgeColor))
  b.uCenterColor.value.copy(hexToVec3(CONFIG.centerColor))
  b.uCenterRadius.value = CONFIG.centerRadius
  b.uCenterFalloff.value = CONFIG.centerFalloff
  b.uSynapse.value.copy(hexToVec3(CONFIG.synapseColor))
  b.uSize.value = CONFIG.particleSize
  b.uSynapseRate.value = CONFIG.synapseRate
  b.uFlowSpeed.value = CONFIG.flowSpeed
  b.uFlowAmount.value = CONFIG.flowAmount
  b.uGlow.value = CONFIG.glowStrength
  b.uDepthDarkness.value = CONFIG.depthDarkness
  b.uDeepColor.value.copy(hexToVec3(CONFIG.deepColor))
  b.uCursorColor.value.copy(hexToVec3(CONFIG.cursorColor))
  a.uColor.value.copy(hexToVec3(CONFIG.ambientColor))
  a.uSize.value = CONFIG.ambientSize
  a.uSpeed.value = CONFIG.ambientSpeed
  a.uRange.value = CONFIG.ambientRange
  finalPass.uniforms.iCornerBlue.value.copy(hexToVec3(CONFIG.cornerBlue))
  finalPass.uniforms.iCornerOrange.value.copy(hexToVec3(CONFIG.cornerOrange))
}

/* ===== UI (remove this block to drop the panel) ===== */
function setupColorUI(config, apply) {
  const panel = document.getElementById('ui-panel')
  const toggle = document.getElementById('ui-toggle')
  const body = document.getElementById('ui-body')
  if (!panel) return
  toggle.addEventListener('click', () => panel.classList.toggle('-open'))
  const _apply = apply
  apply = () => { _apply(); saveConfig(); renderSnapshot(config) }
  const TAU = Math.PI * 2
  const numericRanges = {
    centerRadius:  { min: 0, max: 1.5, step: 0.005 },
    centerFalloff: { min: 0.1, max: 4, step: 0.05 },
    particleSize:  { min: 0.005, max: 0.15, step: 0.001 },
    ambientSize:   { min: 0.005, max: 0.1, step: 0.001 },
    ambientCount:  { min: 0, max: 20000, step: 500 },
    ambientSpeed:  { min: 0, max: 0.2, step: 0.002 },
    ambientRange:  { min: 0, max: 20, step: 0.5 },
    surfaceCount:  { min: 20000, max: 300000, step: 10000 },
    synapseRate:   { min: 0, max: 0.5, step: 0.005 },
    flowSpeed:     { min: 0, max: 4, step: 0.05 },
    flowAmount:    { min: 0, max: 0.1, step: 0.001 },
    glowStrength:  { min: 0, max: 2, step: 0.01 },
    depthDarkness: { min: 0, max: 1, step: 0.01 },
    baseRotationY: { min: -Math.PI, max: Math.PI, step: 0.01 },
    scrollSpin:    { min: 0, max: 2 * TAU, step: 0.05 },
    brainZ:        { min: -2, max: 4.5, step: 0.05 },
    cursorTilt:    { min: 0, max: 0.8, step: 0.01 },
  }
  for (const key of Object.keys(config)) {
    const v = config[key]
    if (typeof v === 'string' && v[0] !== '#') continue   // skip modelUrl
    const row = document.createElement('label')
    row.appendChild(Object.assign(document.createElement('span'), { textContent: key }))
    if (typeof v === 'string' && v[0] === '#') {
      const inp = document.createElement('input')
      inp.type = 'color'; inp.value = v
      inp.addEventListener('input', e => { config[key] = e.target.value; apply() })
      row.appendChild(inp)
    } else if (typeof v === 'number') {
      const r = numericRanges[key] || { min: 0, max: Math.max(1, v * 2), step: 0.01 }
      const inp = document.createElement('input')
      inp.type = 'range'; inp.min = String(r.min); inp.max = String(r.max); inp.step = String(r.step); inp.value = String(v)
      inp.addEventListener('input', e => {
        let val = parseFloat(e.target.value)
        if (Number.isInteger(r.step)) val = Math.round(val / r.step) * r.step
        config[key] = val
        apply()
      })
      row.appendChild(inp)
    }
    body.appendChild(row)
  }
  const btns = document.createElement('div'); btns.style.cssText = 'display:flex;gap:6px;margin-top:8px'
  const mkBtn = (txt) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = txt; b.style.cssText = 'flex:1;cursor:pointer;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:4px;padding:5px 6px;font:11px/1 sans-serif'; return b }
  const reloadBtn = mkBtn('⟳ reload'); const resetBtn = mkBtn('↺ reset')
  reloadBtn.addEventListener('click', () => location.reload())
  resetBtn.addEventListener('click', () => { try { localStorage.removeItem(STORAGE_KEY) } catch (e) {} ; location.reload() })
  btns.appendChild(reloadBtn); btns.appendChild(resetBtn); body.appendChild(btns)
  panel.classList.add('-open')
  renderSnapshot(config)
}
function renderSnapshot(config) {
  const snap = document.getElementById('ui-snapshot')
  if (!snap) return
  const lines = ['const CONFIG = {']
  for (const key of Object.keys(config)) {
    const v = config[key]
    let formatted
    if (typeof v === 'string') formatted = "'" + v + "'"
    else if (Number.isInteger(v)) formatted = String(v)
    else formatted = String(parseFloat(v.toFixed(4)))
    lines.push('  ' + key + ': ' + formatted + ',')
  }
  lines.push('}')
  snap.textContent = lines.join('\n')
}
applyConfig()
setupColorUI(CONFIG, applyConfig)
/* ===== END UI ===== */
</script>
</body>
</html>
