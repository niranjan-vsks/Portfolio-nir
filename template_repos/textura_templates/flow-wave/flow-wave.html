<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scene · Flow Wave</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { height: 100%; }
  /* Canvas is pinned, the document scrolls — scroll flies forward over the sea. */
  #scroll-host { height: 620vh; }
  #scene { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; }
  #scroll-hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.55); font: 11px/1 -apple-system, system-ui, sans-serif;
    letter-spacing: 1px; text-transform: uppercase; pointer-events: none; z-index: 10;
  }

  /* UI PANEL — remove this block to drop the controls */
  #ui-panel { position: fixed; top: 12px; right: 12px; background: rgba(10,10,12,.75); color: #fff;
    font: 11px/1.4 -apple-system, system-ui, sans-serif; padding: 8px 10px; border: 1px solid rgba(255,255,255,.12);
    border-radius: 6px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    max-width: 240px; max-height: 80vh; overflow: auto; z-index: 1000; user-select: none; }
  #ui-toggle { background: none; border: none; color: #fff; cursor: pointer; font-size: 14px; padding: 0; }
  #ui-body { display: none; margin-top: 6px; }
  #ui-panel.-open #ui-body { display: block; }
  #ui-body label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0; }
  #ui-body input[type=color] { width: 28px; height: 20px; border: 1px solid rgba(255,255,255,.2); border-radius: 3px; padding: 0; background: none; cursor: pointer; }
  #ui-body input[type=range] { width: 110px; }
  #ui-buttons { display: flex; gap: 6px; margin-top: 8px; }
  #ui-buttons button { flex: 1; cursor: pointer; background: rgba(255,255,255,.08); color: #fff;
    border: 1px solid rgba(255,255,255,.18); border-radius: 4px; padding: 5px 6px; font: 11px/1 sans-serif; }
  #ui-buttons button:hover { background: rgba(255,255,255,.16); }
  #ui-snapshot { margin: 8px 0 0; padding: 6px 8px; background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12); border-radius: 4px;
    font: 10px/1.45 ui-monospace, 'SF Mono', Menlo, monospace;
    white-space: pre-wrap; word-break: break-word; color: rgba(255,255,255,.88);
    max-height: 240px; overflow: auto; user-select: text; cursor: text; }
  /* END UI PANEL */
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.143.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.143.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="scroll-host"></div>
<div id="scroll-hint">scroll ↓</div>

<!-- UI PANEL — remove this block to drop the controls -->
<div id="ui-panel">
  <button id="ui-toggle" type="button" aria-label="Toggle controls">⚙ controls</button>
  <div id="ui-body"></div>
  <pre id="ui-snapshot" title="Click to select, then copy. These are the current CONFIG values."></pre>
</div>
<!-- END UI PANEL -->

<script type="module">
import * as THREE from 'three'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js'
import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js'
import { CopyShader } from 'three/addons/shaders/CopyShader.js'

/* ============================================================
   CONFIG  — everything tweakable lives here.
   Ported from the `Particles` scroll-morph (`script.js`) phase 4: a
   wide noise sheet of rolling hills. Scroll flies forward over the sea
   (hills stream toward you and grow); the cursor tips the view and the
   world void parts the surface.
============================================================ */
const CONFIG = {
  bgColor: '#02160c',
  flameColor: '#0aff7f',
  flameColor2: '#aef0c0',
  flameAmt: 0.2,
  atmoColor: '#7affbf',
  atmoCount: 300,
  atmoSize: 24,
  atmoSpeed: 1.0,
  colorLow: '#02160c',
  colorHigh: '#34e89a',
  opacity: 0.26,
  pointSize: 5.5,
  brightness: 0.45,
  waveHeight: 3,
  flow: 1,
  tilt: 0,
  scale: 0.275,
  scrollRise: 1.0,        // how much the swell grows on scroll (amplitude only — streaming speed stays constant)
  camStartY: 7,           // scroll 0 — camera above the grid, looking down at an angle
  camStartZ: 16,
  camEndY: 0.8,           // scroll 1 — camera low, skimming almost inside the grid
  camEndZ: -2,
  lookStartZ: 2,          // look target pans from grid centre…
  lookEndZ: -16,          // …to far-forward, so the view turns to look along the grid
  parallax: 1.2,
  pointerRadius: 7.0,
  pointerStrength: 0.9
}

/* ---------- DEFAULTS + localStorage (load before building) ---------- */
const DEFAULTS = JSON.parse(JSON.stringify(CONFIG))
const STORAGE_KEY = 'getlayers:flow-wave'
try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); if (s) for (const k in s) if (k in CONFIG) CONFIG[k] = s[k] } catch (e) {}
function saveConfig() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(CONFIG)) } catch (e) {} }

/* ---------- LAYERS / HELPERS / FINAL PASS ---------- */
const LAYERS = { NONE: 0, TORUS_SCENE: 1, BLOOM_SCENE: 2, ENTIRE_SCENE: 3 }
const Lerp = (a, b, t) => a + (b - a) * t
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v))

function hexToVec3(hex) {
  const n = parseInt(hex.slice(1), 16)
  return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255)
}

// Composite pass + dark complementary background + samudai corner flames (atmosphere).
const FinalPass = {
  uniforms: {
    iTime: { value: 0 },
    tDiffuse: { value: null }, torusTexture: { value: null }, bloomTexture: { value: null }, haloTexture: { value: null },
    uBg: { value: hexToVec3(CONFIG.bgColor) },
    uFlameA: { value: hexToVec3(CONFIG.flameColor) },
    uFlameB: { value: hexToVec3(CONFIG.flameColor2) },
    uFlameAmt: { value: CONFIG.flameAmt }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float iTime; uniform sampler2D tDiffuse; uniform sampler2D bloomTexture; uniform sampler2D torusTexture; uniform sampler2D haloTexture;
    uniform vec3 uBg; uniform vec3 uFlameA; uniform vec3 uFlameB; uniform float uFlameAmt;
    varying vec2 vUv;
    vec3 warp3d(vec3 pos, float t){ float curv=.8,a=1.9,b=0.7; pos*=2.;
      pos.x+=curv*sin(t+a*pos.y)+t*b; pos.y+=curv*cos(t+a*pos.x);
      pos.y+=curv*sin(t+a*pos.z)+t*b; pos.z+=curv*cos(t+a*pos.y);
      pos.z+=curv*sin(t+a*pos.x)+t*b; pos.x+=curv*cos(t+a*pos.z);
      return 0.5+0.5*cos(pos.xyz+vec3(1,2,4)); }
    void main(){
      vec2 uv = 2.*vUv - 1.;
      vec3 w = pow(warp3d(vec3(uv.x, sin(uv.y), uv.y), iTime*1.5), vec3(1.5));
      vec3 flame = 1.5*uFlameA*w.x; flame*=w.y; flame += uFlameB*w.z;
      flame *= smoothstep(0.25, 1., abs(uv.y));
      float md = smoothstep(-0.7, 1., -uv.y*uv.x); flame *= md*md;
      vec3 bg = uBg * (1.0 - 0.4 * length(uv));
      vec3 halo = texture2D(haloTexture, vUv).xyz;
      gl_FragColor = vec4(bg + flame*uFlameAmt + texture2D(bloomTexture, vUv).xyz + texture2D(torusTexture, vUv).xyz + texture2D(tDiffuse, vUv).xyz + halo, 1.);
    }`
}

/* ---------- RENDERER / SCENE / CAMERA ---------- */
const canvas = document.getElementById('scene')
const renderer = new THREE.WebGL1Renderer({ canvas, antialias: true })
renderer.setPixelRatio(window.devicePixelRatio)
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap
const scene = new THREE.Scene()
scene.background = new THREE.Color(0x000000); scene.fog = new THREE.Fog(0x000000, 0, 15)
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 400)
camera.position.set(0, 7, 16)
camera.layers.enable(LAYERS.TORUS_SCENE); camera.layers.enable(LAYERS.BLOOM_SCENE); camera.layers.enable(LAYERS.ENTIRE_SCENE)
scene.add(camera)

/* ---------- COMPOSER (reduced bloom; final pass is composite-only) ---------- */
const renderScene = new RenderPass(scene, camera)
const torusComposer = new EffectComposer(renderer); torusComposer.renderToScreen = false
torusComposer.addPass(renderScene)
torusComposer.addPass(new ShaderPass(GammaCorrectionShader))
torusComposer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.22, 0.2, 0))
torusComposer.addPass(new ShaderPass(CopyShader))
const bloomComposer = new EffectComposer(renderer); bloomComposer.renderToScreen = false
bloomComposer.addPass(renderScene)
bloomComposer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.4, 0.55, 0))
bloomComposer.addPass(new ShaderPass(GammaCorrectionShader))
const finalPass = new ShaderPass(FinalPass)
finalPass.uniforms.bloomTexture.value = bloomComposer.renderTarget1.texture
finalPass.uniforms.torusTexture.value = torusComposer.renderTarget1.texture
const finalComposer = new EffectComposer(renderer)
finalComposer.addPass(renderScene); finalComposer.addPass(finalPass)

/* ---------- shared GLSL (3D simplex noise) ---------- */
const SNOISE = `
  vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
  vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
  float snoise(vec3 v){
    const vec2 C = vec2(1.0/6.0, 1.0/3.0); const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
    vec3 i = floor(v + dot(v, C.yyy)); vec3 x0 = v - i + dot(i, C.xxx);
    vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g;
    vec3 i1 = min(g.xyz, l.zxy); vec3 i2 = max(g.xyz, l.zxy);
    vec3 x1 = x0 - i1 + 1.0 * C.xxx; vec3 x2 = x0 - i2 + 2.0 * C.xxx; vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;
    i = mod(i, 289.0);
    vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
    float n_ = 1.0/7.0; vec3 ns = n_ * D.wyz - D.xzx;
    vec4 j = p - 49.0 * floor(p * ns.z *ns.z);
    vec4 x_ = floor(j * ns.z); vec4 y_ = floor(j - 7.0 * x_);
    vec4 x = x_ *ns.x + ns.yyyy; vec4 y = y_ *ns.x + ns.yyyy; vec4 h = 1.0 - abs(x) - abs(y);
    vec4 b0 = vec4(x.xy, y.xy); vec4 b1 = vec4(x.zw, y.zw);
    vec4 s0 = floor(b0)*2.0 + 1.0; vec4 s1 = floor(b1)*2.0 + 1.0; vec4 sh = -step(h, vec4(0.0));
    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy; vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
    vec3 p0 = vec3(a0.xy,h.x); vec3 p1 = vec3(a0.zw,h.y); vec3 p2 = vec3(a1.xy,h.z); vec3 p3 = vec3(a1.zw,h.w);
    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
    vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0); m = m * m;
    return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
  }`

/* ---------- SCROLL (double-damped) + POINTER (camera parallax + world cursor void) ---------- */
let scrollTarget = 0, scrollSmooth = 0, scrollCurrent = 0
function updateScroll() {
  const max = document.documentElement.scrollHeight - window.innerHeight
  scrollTarget = max > 0 ? clamp(window.scrollY / max, 0, 1) : 0
}
window.addEventListener('scroll', updateScroll, { passive: true }); updateScroll()

const mouseTarget = { x: 0, y: 0 }, mouse = { x: 0, y: 0 }
const POINTER = { world: new THREE.Vector3(), activity: 0, active: false, lastMove: performance.now() }
window.addEventListener('mousemove', e => {
  mouseTarget.x = (e.clientX / window.innerWidth) * 2 - 1
  mouseTarget.y = -((e.clientY / window.innerHeight) * 2 - 1)
  POINTER.active = true; POINTER.lastMove = performance.now()
}, { passive: true })
window.addEventListener('mouseout', () => { POINTER.active = false }, { passive: true })
const _ndc = new THREE.Vector3(), _dir = new THREE.Vector3(), _tgt = new THREE.Vector3()
function updatePointerWorld() {
  _tgt.set(0, 0, 0)
  if (POINTER.active) {
    _ndc.set(mouse.x, mouse.y, 0.5).unproject(camera)
    _dir.copy(_ndc).sub(camera.position).normalize()
    const dn = _dir.z
    if (Math.abs(dn) > 1e-4) { const tt = -camera.position.z / dn; if (tt > 0 && Number.isFinite(tt)) _tgt.copy(camera.position).addScaledVector(_dir, tt) }
  }
  POINTER.world.lerp(_tgt, 0.12)
  const idle = (performance.now() - POINTER.lastMove) / 1000
  POINTER.activity += (((POINTER.active && idle < 3) ? 1 : 0) - POINTER.activity) * 0.06
}

/* ============================================================
   SCENE: Flow Wave — a wide noise sheet of rolling hills. Scroll streams
   the hills toward the camera and grows the swell while the plane tips
   down (flying forward over a rising sea); the cursor tips the view and
   the world void parts the surface.
============================================================ */
class FlowWave {
  constructor(scene) {
    this.uniforms = {
      uTime:       { value: 0 },
      uStream:     { value: 0 },
      uAppear:     { value: 0 },
      uColLow:     { value: hexToVec3(CONFIG.colorLow) },
      uColHigh:    { value: hexToVec3(CONFIG.colorHigh) },
      uOpacity:    { value: CONFIG.opacity },
      uSize:       { value: CONFIG.pointSize },
      uBrightness: { value: CONFIG.brightness },
      uWaveHeight: { value: CONFIG.waveHeight },
      uFlow:       { value: CONFIG.flow },
      uScale:      { value: CONFIG.scale },
      uCursor:        { value: new THREE.Vector3() },
      uRepelRadius:   { value: CONFIG.pointerRadius },
      uRepelStrength: { value: CONFIG.pointerStrength },
      uActivity:      { value: 0 }
    }
    this.geometry = new THREE.SphereGeometry(4.2, 200, 600)
    this.material = new THREE.ShaderMaterial({
      uniforms: this.uniforms,
      vertexShader: `
        uniform float uTime; uniform float uStream; uniform float uSize; uniform float uWaveHeight; uniform float uFlow; uniform float uScale;
        uniform vec3 uColLow; uniform vec3 uColHigh;
        uniform vec3 uCursor; uniform float uRepelRadius; uniform float uRepelStrength; uniform float uActivity;
        varying float vFade; varying vec3 vColor;
        ${SNOISE}
        void main() {
          vec3 wp = vec3(position.x * 13.0, 0.0, position.z * 25.0);
          wp.x += position.y * 6.0;
          // uStream slides the sampled hills toward the camera (forward flight).
          float zc = wp.z + uStream;
          float wn = snoise(vec3(wp.x * 0.08, zc * 0.08, uTime * 0.15 * uFlow)) * 2.0;
          wn += snoise(vec3(wp.x * 0.16, zc * 0.16, uTime * 0.3 * uFlow)) * 0.8;
          wp.y += wn * uWaveHeight;

          vec3 finalPos = wp * uScale;
          vec4 modelPosition = modelMatrix * vec4(finalPos, 1.0);
          vec3 toP = modelPosition.xyz - uCursor;
          float cd = length(toP);
          float fall = smoothstep(uRepelRadius, 0.0, cd);
          modelPosition.xyz += normalize(toP + vec3(0.0001)) * fall * uRepelStrength * uActivity;
          vec4 mvPosition = viewMatrix * modelPosition;

          float colMix = smoothstep(-3.0, 3.0, position.y + position.x * 0.5);
          vColor = mix(uColLow, uColHigh, clamp(colMix, 0.0, 1.0));
          vFade = 1.0;

          gl_PointSize = uSize * (10.0 / -mvPosition.z);
          gl_PointSize = max(gl_PointSize, 1.5);
          gl_Position = projectionMatrix * mvPosition;
        }`,
      fragmentShader: `
        uniform float uOpacity; uniform float uBrightness; uniform float uAppear;
        varying float vFade; varying vec3 vColor;
        void main() {
          vec2 xy = gl_PointCoord - 0.5;
          float ll = length(xy);
          if (ll > 0.5) discard;
          float a = smoothstep(0.5, 0.1, ll);
          gl_FragColor = vec4(vColor * uBrightness, vFade * a * uOpacity * uAppear);
        }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    })
    this.group = new THREE.Group()
    this.points = new THREE.Points(this.geometry, this.material)
    this.points.frustumCulled = false
    this.points.layers.enable(LAYERS.ENTIRE_SCENE)
    this.group.add(this.points)
    scene.add(this.group)

    this.appearStart = performance.now()
    this.t0 = performance.now() / 1000
    this.stream = 0
  }

  resize() {}

  render(scroll, m) {
    const t = performance.now() / 1000
    const dt = Math.min(0.05, t - this.t0); this.t0 = t
    this.uniforms.uTime.value = t

    // Stream the hills toward us (faster on scroll), grow the swell.
    this.stream += dt * (CONFIG.flow * 2.0) * 4.0
    this.uniforms.uStream.value = this.stream
    this.uniforms.uWaveHeight.value = CONFIG.waveHeight * (1 + scroll * CONFIG.scrollRise)

    // Camera fly-path: from above & back at a downward angle (scroll 0) →
    // descend and approach → skim low, almost inside, looking forward along
    // the grid (scroll 1). The grid itself stays a stable flat field.
    const ea = Math.min(scroll / 0.35, 1.0)
    const e = ea * ea * (3 - 2 * ea)
    const camY = Lerp(CONFIG.camStartY, CONFIG.camEndY, e)
    const camZ = Lerp(CONFIG.camStartZ, CONFIG.camEndZ, e)
    camera.position.set(m.x * CONFIG.parallax, camY + m.y * CONFIG.parallax * 0.3, camZ)
    camera.lookAt(m.x * CONFIG.parallax * 0.5, Lerp(0.0, 0.6, e), Lerp(CONFIG.lookStartZ, CONFIG.lookEndZ, e))
    this.group.rotation.x = -CONFIG.tilt
    this.group.rotation.y = 0
    updatePointerWorld()

    this.uniforms.uCursor.value.copy(POINTER.world)
    this.uniforms.uActivity.value = POINTER.activity
    const elapsed = (performance.now() - this.appearStart) / 1000
    this.uniforms.uAppear.value = Math.max(0, Math.min(1, (elapsed - 0.2) / 1.4))
  }
}

const sceneObj = new FlowWave(scene)

/* ---------- ambient atmosphere particles (camera-attached drifting motes) ---------- */
let atmoMat = null
;(function () {
  const N = Math.round(CONFIG.atmoCount)
  const positions = new Float32Array(N * 3), sizes = new Float32Array(N), seeds = new Float32Array(N)
  for (let i = 0; i < N; i++) {
    positions[i*3] = 2*Math.random()-1; positions[i*3+1] = 2*Math.random()-1; positions[i*3+2] = 2*Math.random()-1
    sizes[i] = CONFIG.atmoSize * (0.4 + Math.random()); seeds[i] = Math.random()
  }
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3))
  g.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1))
  g.setAttribute('seed', new THREE.Float32BufferAttribute(seeds, 1))
  atmoMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uColor: { value: hexToVec3(CONFIG.atmoColor) },
      uRes: { value: new THREE.Vector2(window.innerWidth * window.devicePixelRatio, window.innerHeight * window.devicePixelRatio) } },
    vertexShader: `
      attribute float size; attribute float seed; uniform float uTime; uniform vec2 uRes;
      varying float vA;
      vec3 warp(vec3 p, float t){ float c=0.9,a=1.9,b=0.02,s=0.05; p*=2.;
        p.x+=c*sin(s*t+a*p.y)+t*b; p.y+=c*cos(s*t+a*p.x); p.y+=c*sin(s*t+a*p.z)+t*b;
        p.z+=c*cos(s*t+a*p.y); p.z+=c*sin(s*t+a*p.x)+t*b; p.x+=c*cos(s*t+a*p.z);
        return cos(p+vec3(1,2,4)); }
      void main(){
        vec3 v = position*4.0 + warp(position, uTime)*1.2;
        vec4 mv = modelViewMatrix * vec4(v, 1.0);
        float r = length(v); float farF = 1.0 - smoothstep(5.0, 6.5, r); float nearF = smoothstep(0.0, 0.5, -mv.z);
        vA = farF * nearF;
        gl_PointSize = size * uRes.y / 900.0 / -mv.z; gl_PointSize = max(gl_PointSize, 1.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor; varying float vA;
      void main(){ vec2 p = gl_PointCoord - 0.5; float l = length(p); if (l > 0.5) discard;
        float tex = smoothstep(0.5, 0.0, l); gl_FragColor = vec4(uColor * tex, tex * vA * 0.6); }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false
  })
  const pts = new THREE.Points(g, atmoMat)
  pts.frustumCulled = false
  pts.layers.enable(LAYERS.ENTIRE_SCENE)
  scene.add(pts)
  pts.onBeforeRender = () => {
    const t = performance.now() / 1000
    atmoMat.uniforms.uTime.value = t * CONFIG.atmoSpeed * 8.0
    pts.position.copy(camera.position)
    finalPass.uniforms.iTime.value = t
  }
})()

/* ---------- CONFIG → uniforms ---------- */
function applyConfig() {
  finalPass.uniforms.uBg.value.copy(hexToVec3(CONFIG.bgColor))
  finalPass.uniforms.uFlameA.value.copy(hexToVec3(CONFIG.flameColor))
  finalPass.uniforms.uFlameB.value.copy(hexToVec3(CONFIG.flameColor2))
  finalPass.uniforms.uFlameAmt.value = CONFIG.flameAmt
  if (atmoMat) atmoMat.uniforms.uColor.value.copy(hexToVec3(CONFIG.atmoColor))
  sceneObj.uniforms.uColLow.value.copy(hexToVec3(CONFIG.colorLow))
  sceneObj.uniforms.uColHigh.value.copy(hexToVec3(CONFIG.colorHigh))
  sceneObj.uniforms.uOpacity.value = CONFIG.opacity
  sceneObj.uniforms.uSize.value = CONFIG.pointSize
  sceneObj.uniforms.uBrightness.value = CONFIG.brightness
  sceneObj.uniforms.uWaveHeight.value = CONFIG.waveHeight
  sceneObj.uniforms.uFlow.value = CONFIG.flow
  sceneObj.uniforms.uScale.value = CONFIG.scale
  sceneObj.uniforms.uRepelRadius.value = CONFIG.pointerRadius
  sceneObj.uniforms.uRepelStrength.value = CONFIG.pointerStrength
}

/* ---------- RESIZE ---------- */
function resize() {
  const w = window.innerWidth, h = window.innerHeight, dpr = window.devicePixelRatio
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false)
  camera.aspect = w / h; camera.updateProjectionMatrix()
  for (const c of [torusComposer, bloomComposer, finalComposer]) { c.setPixelRatio(dpr); c.setSize(w, h) }
  sceneObj.resize(); updateScroll()
}
window.addEventListener('resize', resize); resize()

/* ---------- RENDER LOOP ---------- */
function render() {
  requestAnimationFrame(render)
  scrollSmooth = Lerp(scrollSmooth, scrollTarget, 0.10)
  scrollCurrent = Lerp(scrollCurrent, scrollSmooth, 0.06)
  mouse.x = Lerp(mouse.x, mouseTarget.x, 0.06)
  mouse.y = Lerp(mouse.y, mouseTarget.y, 0.06)
  sceneObj.render(scrollCurrent, mouse)
  camera.layers.set(LAYERS.TORUS_SCENE);  torusComposer.render()
  camera.layers.set(LAYERS.BLOOM_SCENE);  bloomComposer.render()
  camera.layers.set(LAYERS.ENTIRE_SCENE); finalComposer.render()
}
render()

/* ===== UI (remove this block to drop the panel) ===== */
function setupColorUI(config, apply) {
  const panel = document.getElementById('ui-panel')
  const toggle = document.getElementById('ui-toggle')
  const body = document.getElementById('ui-body')
  if (!panel) return
  toggle.addEventListener('click', () => panel.classList.toggle('-open'))
  const _apply = apply
  apply = () => { _apply(); saveConfig(); renderSnapshot(config) }
  const numericRanges = {
    flameAmt:      { min: 0, max: 3, step: 0.05 },
    atmoCount:     { min: 0, max: 1200, step: 10 },
    atmoSize:      { min: 0, max: 80, step: 1 },
    atmoSpeed:     { min: 0, max: 4, step: 0.05 },
    opacity:       { min: 0, max: 2, step: 0.01 },
    pointSize:     { min: 1, max: 20, step: 0.5 },
    brightness:    { min: 0, max: 4, step: 0.05 },
    waveHeight:    { min: 0, max: 6, step: 0.05 },
    flow:          { min: 0, max: 4, step: 0.05 },
    tilt:          { min: -1.57, max: 1.57, step: 0.01 },
    scale:         { min: 0.04, max: 0.6, step: 0.005 },
    scrollRise:    { min: 0, max: 4, step: 0.05 },
    camStartY:     { min: 0, max: 20, step: 0.1 },
    camStartZ:     { min: -10, max: 30, step: 0.1 },
    camEndY:       { min: -2, max: 10, step: 0.1 },
    camEndZ:       { min: -20, max: 20, step: 0.1 },
    lookStartZ:    { min: -20, max: 20, step: 0.1 },
    lookEndZ:      { min: -30, max: 10, step: 0.1 },
    parallax:      { min: 0, max: 5, step: 0.05 },
    pointerRadius:   { min: 0, max: 8, step: 0.1 },
    pointerStrength: { min: 0, max: 5, step: 0.05 }
  }
  for (const key of Object.keys(config)) {
    const v = config[key]
    const row = document.createElement('label')
    row.appendChild(Object.assign(document.createElement('span'), { textContent: key }))
    if (typeof v === 'string' && v[0] === '#') {
      const inp = document.createElement('input')
      inp.type = 'color'; inp.value = v
      inp.addEventListener('input', e => { config[key] = e.target.value; apply() })
      row.appendChild(inp)
    } else if (typeof v === 'number') {
      const r = numericRanges[key] || { min: 0, max: Math.max(1, v * 2), step: 0.01 }
      const inp = document.createElement('input')
      inp.type = 'range'; inp.min = String(r.min); inp.max = String(r.max); inp.step = String(r.step); inp.value = String(v)
      inp.addEventListener('input', e => {
        let val = parseFloat(e.target.value)
        if (Number.isInteger(r.step)) val = Math.round(val / r.step) * r.step
        config[key] = val
        apply()
      })
      row.appendChild(inp)
    }
    body.appendChild(row)
  }
  // Reload / Reset buttons
  const btns = document.createElement('div'); btns.id = 'ui-buttons'
  const reloadBtn = document.createElement('button'); reloadBtn.type = 'button'; reloadBtn.textContent = '⟳ reload'
  const resetBtn  = document.createElement('button'); resetBtn.type = 'button'; resetBtn.textContent = '↺ reset'
  reloadBtn.title = 'Reload the page — re-initialise the scene with the saved settings'
  resetBtn.title = 'Clear saved settings and reload with defaults'
  reloadBtn.addEventListener('click', () => location.reload())
  resetBtn.addEventListener('click', () => { try { localStorage.removeItem(STORAGE_KEY) } catch (e) {} ; location.reload() })
  btns.appendChild(reloadBtn); btns.appendChild(resetBtn)
  body.appendChild(btns)
  panel.classList.add('-open')
  renderSnapshot(config)
}
function renderSnapshot(config) {
  const snap = document.getElementById('ui-snapshot')
  if (!snap) return
  const lines = ['const CONFIG = {']
  for (const key of Object.keys(config)) {
    const v = config[key]
    let formatted
    if (typeof v === 'string') formatted = "'" + v + "'"
    else if (Number.isInteger(v)) formatted = String(v)
    else formatted = String(parseFloat(v.toFixed(4)))
    lines.push('  ' + key + ': ' + formatted + ',')
  }
  lines.push('}')
  snap.textContent = lines.join('\n')
}
applyConfig()
setupColorUI(CONFIG, applyConfig)
/* ===== END UI ===== */
</script>
</body>
